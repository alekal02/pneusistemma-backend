# Blueprint Render — use com Neon: defina DATABASE_URL manualmente no painel
# (Neon Connection string URI). Se preferir Postgres do Render, descomente fromDatabase.

services:
  - type: web
    name: pneusistemma-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      # Cole a URI do Neon no painel (Environment)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSAO_OCIOSIDADE_MIN
        value: "30"
      - key: SESSAO_DURACAO_HORAS
        value: "12"
      - key: SESSAO_TOQUE_MIN
        value: "1"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WUZAPI_BASE_URL
        sync: false
      - key: WUZAPI_TOKEN
        sync: false
      - key: WUZAPI_ADMIN_TOKEN
        sync: false
      - key: WUZAPI_WEBHOOK_PUBLIC_URL
        sync: false
      - key: WUZAPI_WEBHOOK_SECRET
        sync: false
      - key: GERENTE_COMPRAS_WHATSAPP
        sync: false
      - key: WHATSAPP_ALERTAS_ENABLED
        value: "false"
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: SULCO_MINIMO_MM
        value: "3.0"
      - key: SULCO_ALERTA_MM
        value: "8.0"
